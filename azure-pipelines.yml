parameters:

- name: tipoEjecucion
  displayName: 'Tipo de ejecución'
  type: string
  default: normal
  values:
  - normal
  - demo-error

- name: suite
  displayName: 'Suite a ejecutar'
  type: string
  default: smoke
  values:
  - smoke
  - regression

- name: modulo
  displayName: 'Módulo a ejecutar'
  type: string
  default: todos
  values:
  - todos
  - login
  - pim


trigger:
- main


pool:
  vmImage: 'windows-latest'


steps:

- task: UseNode@1
  displayName: 'Instalar Node.js'
  inputs:
    version: '22'


- script: npm ci
  displayName: 'Instalar dependencias'


- powershell: |
    Write-Host "Probando acceso al ambiente configurado..."

    if (-not $env:ORANGEHRM_URL) {
      Write-Error "La variable ORANGEHRM_URL no está configurada."
      exit 1
    }

    try {
      $response = Invoke-WebRequest `
        -Uri $env:ORANGEHRM_URL `
        -UseBasicParsing `
        -TimeoutSec 30

      Write-Host "OrangeHRM responde correctamente."
      Write-Host "Status Code: $($response.StatusCode)"
    }
    catch {
      Write-Error "Azure no pudo conectarse a OrangeHRM: $($_.Exception.Message)"
      exit 1
    }

  displayName: 'Validar conectividad con OrangeHRM'

  env:
    ORANGEHRM_URL: $(ORANGEHRM_URL)


- powershell: |
    $tipo = '${{ parameters.tipoEjecucion }}'
    $suite = '${{ parameters.suite }}'
    $modulo = '${{ parameters.modulo }}'

    Write-Host "======================================"
    Write-Host "Configuracion de ejecucion"
    Write-Host "Tipo: $tipo"
    Write-Host "Suite: $suite"
    Write-Host "Modulo: $modulo"
    Write-Host "======================================"

    if (-not $env:ORANGEHRM_URL -or
        -not $env:ORANGEHRM_USER -or
        -not $env:ORANGEHRM_PASSWORD) {

      Write-Error "Faltan variables de entorno requeridas para OrangeHRM."
      exit 1
    }

    if ($tipo -eq 'demo-error') {

      Write-Host "Ejecutando demostracion de error controlado"

      npx.cmd playwright test --grep "@demo-error"

    }
    elseif ($modulo -eq 'todos') {

      Write-Host "Ejecutando suite completa: @$suite"

      npx.cmd playwright test --grep "@$suite"

    }
    elseif ($modulo -eq 'login') {

      Write-Host "Ejecutando modulo Login con suite: @$suite"

      npx.cmd playwright test `
        tests/orangehrm/login.spec.ts `
        --grep "@$suite"

    }
    elseif ($modulo -eq 'pim') {

      Write-Host "Ejecutando modulo PIM con suite: @$suite"

      npx.cmd playwright test `
        tests/orangehrm/pim.spec.ts `
        --grep "@$suite"

    }

  displayName: 'Ejecutar pruebas seleccionadas'

  env:
    CI: 'true'
    ORANGEHRM_URL: $(ORANGEHRM_URL)
    ORANGEHRM_USER: $(ORANGEHRM_USER)
    ORANGEHRM_PASSWORD: $(ORANGEHRM_PASSWORD)


- task: PublishTestResults@2
  displayName: 'Publicar resultados de pruebas en Azure'
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'test-results/junit.xml'
    testRunTitle: 'Pruebas E2E Playwright - OrangeHRM'
  condition: succeededOrFailed()


- task: PublishPipelineArtifact@1
  displayName: 'Publicar reporte HTML'
  inputs:
    targetPath: 'playwright-report'
    artifact: 'playwright-report'
    publishLocation: 'pipeline'
  condition: succeededOrFailed()


- task: PublishPipelineArtifact@1
  displayName: 'Publicar evidencias de pruebas'
  inputs:
    targetPath: 'test-results'
    artifact: 'test-results'
    publishLocation: 'pipeline'
  condition: succeededOrFailed()