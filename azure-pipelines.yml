parameters:
- name: suite
  displayName: 'Suite a ejecutar'
  type: string
  default: regression
  values:
  - smoke
  - regression

- name: modulo
  displayName: 'Módulo a ejecutar'
  type: string
  default: todos
  values:
  - todos
  - login
  - pim

trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:
- task: UseNode@1
  displayName: 'Instalar Node.js'
  inputs:
    version: '22'

- script: npm ci
  displayName: 'Instalar dependencias'

- powershell: |
    New-Item -ItemType Directory -Force `
      -Path 'playwright-report', 'test-results' | Out-Null
  displayName: 'Preparar carpetas de evidencias'

- powershell: |
    if (-not $env:ORANGEHRM_URL) {
      Write-Error 'La variable ORANGEHRM_URL no está configurada.'
      exit 1
    }

    try {
      $response = Invoke-WebRequest `
        -Uri $env:ORANGEHRM_URL `
        -UseBasicParsing `
        -TimeoutSec 30

      Write-Host "OrangeHRM responde con estado $($response.StatusCode)."
    }
    catch {
      Write-Error "Azure no pudo conectarse al ambiente de prueba: $($_.Exception.Message)"
      exit 1
    }
  displayName: 'Validar conectividad con OrangeHRM'
  env:
    ORANGEHRM_URL: $(ORANGEHRM_URL)

- powershell: |
    $suite = '${{ parameters.suite }}'
    $modulo = '${{ parameters.modulo }}'

    if (-not $env:ORANGEHRM_URL -or
        -not $env:ORANGEHRM_USER -or
        -not $env:ORANGEHRM_PASSWORD) {
      Write-Error 'Faltan variables de entorno requeridas para OrangeHRM.'
      exit 1
    }

    $argumentos = @('playwright', 'test')

    if ($modulo -eq 'login') {
      $argumentos += 'tests/orangehrm/login.spec.ts'
    }
    elseif ($modulo -eq 'pim') {
      $argumentos += 'tests/orangehrm/pim.spec.ts'
    }

    $argumentos += @('--grep', "@$suite")

    Write-Host "Ejecutando suite=$suite, modulo=$modulo"
    & npx.cmd @argumentos
    exit $LASTEXITCODE
  displayName: 'Ejecutar pruebas E2E seleccionadas'
  env:
    CI: 'true'
    ORANGEHRM_URL: $(ORANGEHRM_URL)
    ORANGEHRM_USER: $(ORANGEHRM_USER)
    ORANGEHRM_PASSWORD: $(ORANGEHRM_PASSWORD)

- task: PublishTestResults@2
  displayName: 'Publicar resultados JUnit en Azure'
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'test-results/junit.xml'
    testRunTitle: 'Pruebas E2E Playwright - OrangeHRM'
    publishRunAttachments: true
    failTaskOnFailedTests: true
  condition: always()

- task: PublishPipelineArtifact@1
  displayName: 'Publicar reporte HTML'
  inputs:
    targetPath: 'playwright-report'
    artifact: 'playwright-report'
    publishLocation: 'pipeline'
  condition: always()

- task: PublishPipelineArtifact@1
  displayName: 'Publicar JSON, JUnit, screenshots y trazas'
  inputs:
    targetPath: 'test-results'
    artifact: 'test-results'
    publishLocation: 'pipeline'
  condition: always()
